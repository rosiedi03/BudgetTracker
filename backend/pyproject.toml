[project]
name = "budgettracker"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Daniel Curry", email = "87614608+daniel-curry@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.fastapi]
entrypoint = "budgettracker.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
